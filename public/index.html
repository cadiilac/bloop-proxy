<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloop Proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 1rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { text-align: center; color: #333; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #666; margin-bottom: 1.5rem; }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="url"] {
      flex: 1;
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
    }
    input[type="url"]:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #e3f2fd; color: #1565c0; }
    .status.warning { background: #fff3e0; color: #e65100; }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .iframe-container {
      position: relative;
      width: 100%;
      height: 800px;
      border: 2px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .cookie-manager {
      margin-top: 1rem;
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .cookie-manager h3 { margin-bottom: 0.5rem; }
    textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: vertical;
    }
    .tips {
      margin-top: 1rem;
      padding: 1rem;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .tips h4 { margin-bottom: 0.5rem; }
    .tips ul { margin-left: 1.5rem; }
    .tips li { margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>⚡ Fast Proxy</h1>
      <p class="subtitle">CAPTCHA-compatible with session persistence</p>
      
      <div class="input-group">
        <input type="url" id="urlInput" placeholder="https://example.com/login" autofocus>
        <button onclick="loadProxy()" id="loadBtn">Load</button>
      </div>
      
      <div class="status info" id="status"></div>
      
      <div class="cookie-manager">
        <h3>🍪 Session Cookies (auto-captured)</h3>
        <textarea id="cookieJar" rows="3" placeholder="Cookies will appear here after first request..."></textarea>
        <button onclick="clearCookies()" style="margin-top: 0.5rem; padding: 0.5rem 1rem;">Clear Cookies</button>
      </div>
      
      <div class="tips">
        <h4>💡 CAPTCHA Tips:</h4>
        <ul>
          <li>Google/reCAPTCHA: Works normally, solve in the iframe</li>
          <li>Cloudflare: May require refreshing once</li>
          <li>hCaptcha: Fully supported</li>
          <li>Login sessions persist via cookies above</li>
        </ul>
      </div>
    </div>
    
    <div class="card" id="iframeCard" style="display: none;">
      <div class="iframe-container">
        <iframe id="proxyFrame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation"></iframe>
      </div>
    </div>
  </div>

  <script>
    let currentCookies = '';
    
    function loadProxy() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      
      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      
      const status = document.getElementById('status');
      status.textContent = 'Loading through proxy...';
      status.className = 'status info show';
      
      // Build proxy URL with cookies
      let proxyUrl = '/api/proxy?url=' + encodeURIComponent(url);
      if (currentCookies) {
        proxyUrl += '&_cookies=' + encodeURIComponent(currentCookies);
      }
      
      const frame = document.getElementById('proxyFrame');
      frame.src = proxyUrl;
      
      frame.onload = () => {
        btn.disabled = false;
        btn.textContent = 'Load';
        document.getElementById('iframeCard').style.display = 'block';
        status.textContent = 'Loaded! If you see a CAPTCHA, solve it normally.';
        status.className = 'status success show';
      };
      
      frame.onerror = () => {
        btn.disabled = false;
        btn.textContent = 'Load';
        status.textContent = 'Error loading page. Try again or check URL.';
        status.className = 'status warning show';
      };
    }
    
    function clearCookies() {
      currentCookies = '';
      document.getElementById('cookieJar').value = '';
      document.getElementById('status').textContent = 'Cookies cleared';
      document.getElementById('status').className = 'status info show';
    }
    
    // Listen for messages from iframe (CAPTCHA detection)
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'captcha-solved') {
        document.getElementById('status').textContent = 'CAPTCHA solved! Submitting form...';
        document.getElementById('status').className = 'status success show';
      }
      if (e.data?.type === 'captcha-detected') {
        document.getElementById('status').textContent = 'CAPTCHA detected. Solve it to continue.';
        document.getElementById('status').className = 'status warning show';
      }
    });
    
    // Capture cookies from iframe responses (via service worker or header inspection)
    // This is a simplified version - real implementation would parse X-Set-Cookie header
    
    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadProxy();
    });
  </script>
</body>
</html>
